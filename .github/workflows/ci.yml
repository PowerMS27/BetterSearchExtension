name: CI Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean installation environment
        run: |
          rm -rf node_modules
          rm -f package-lock.json
          npm cache clean --force

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (with rollup fix)
        run: |
          npm install --ignore-scripts
          npm install @rollup/rollup-linux-x64-gnu --no-save

      - name: Run Unit Tests
        run: npm run test

  build:
    name: Build Project
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean installation environment
        run: |
          rm -rf node_modules
          rm -f package-lock.json
          npm cache clean --force

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (with rollup fix)
        run: |
          npm install --ignore-scripts
          npm install @rollup/rollup-linux-x64-gnu --no-save

      - name: Build project
        run: npm run build